<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG智能知识库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #409eff;
            color: white;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
        }
        /* 新增：header 左右布局，右侧放管理入口 */
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-title {
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .token-input {
            width: 310px;
            max-width: 52vw;
            padding: 6px 10px;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 4px;
            outline: none;
            color: #333;
            background: rgba(255,255,255,0.95);
            font-size: 13px;
        }
        .token-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .token-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .auth-status {
            max-width: 260px;
            font-size: 12px;
            font-weight: normal;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
        }
        .auth-status.error {
            color: #ffe0e0;
        }
        .admin-entry-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: none; /* 默认隐藏，管理员角色才显示 */
        }
        .admin-entry-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .send-btn:disabled,
        .token-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }
        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        /* 左侧上传区 */
        .upload-panel {
            width: 300px;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .upload-panel h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .file-input {
            width: 100%;
        }
        .upload-btn {
            width: 100%;
            padding: 10px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .upload-btn:hover {
            background-color: #66b1ff;
        }
        .upload-result {
            font-size: 13px;
            color: #67c23a;
            word-break: break-all;
        }
        .upload-result.error {
            color: #f56c6c;
        }
        /* 右侧聊天区 */
        .chat-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-mode-bar {
            padding: 10px 15px;
            border-bottom: 1px solid #ebeef5;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 13px;
        }
        .chat-mode-select {
            padding: 5px 8px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: white;
            color: #333;
            outline: none;
        }
        .agent-session-status {
            margin-left: auto;
            color: #999;
            font-size: 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
        }
        .message.user {
            align-self: flex-end;
            background-color: #409eff;
            color: white;
        }
        .message.ai {
            align-self: flex-start;
            background-color: #f0f2f5;
            color: #333;
        }
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #ebeef5;
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            resize: none; /* 禁止手动拉伸 */
            line-height: 1.5;
            max-height: 120px; /* 最大高度，超出滚动 */
            overflow-y: auto;
            font-family: inherit;
        }
        .chat-input:focus {
            border-color: #409eff;
        }
        .send-btn {
            padding: 0 20px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .send-btn:hover {
            background-color: #66b1ff;
        }
        /* 思考中加载动画 */
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #999;
            animation: dot-bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }
        .thinking-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }
        @keyframes dot-bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        /* ----------新增：文档列表样式 ---------------*/
        .doc-list-title{
            font-size: 14px;
            font-weight:bold;
            margin-top: 16px;
            margin-bottom: 8px;
            color: #333;
        }
        #docListBox{
            font-size: 13px;
            max-height: 180px;
            overflow-y: auto;
        }
        .doc-item{
            padding:4px 0;
            color:#555;
            border-bottom:1px solid #f2f2f2;
        }
        /* ----------新增：管理员面板样式 ---------------*/
        .admin-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            display: none; /* 默认隐藏，点击管理入口后显示 */
            flex-direction: column;
            margin: 20px;
        }
        .admin-tabs {
            display: flex;
            border-bottom: 1px solid #ebeef5;
        }
        .admin-tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 2px solid transparent;
        }
        .admin-tab.active {
            color: #409eff;
            border-bottom-color: #409eff;
        }
        .admin-tab-right {
            margin-left: auto;
            padding: 12px 20px;
        }
        .exit-admin-btn {
            cursor: pointer;
            color: #999;
            font-size: 14px;
        }
        .exit-admin-btn:hover {
            color: #409eff;
        }
        .admin-tab-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .admin-table th, .admin-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f2f2f2;
        }
        .admin-table th {
            background: #fafafa;
            color: #333;
            font-weight: 500;
        }
        .admin-pagination {
            padding: 15px 20px;
            border-top: 1px solid #ebeef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }
        .log-result {
            display: block;
            max-width: 520px;
            line-height: 1.5;
            word-break: break-word;
        }
        .log-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            background: #f0f2f5;
            color: #606266;
            font-size: 12px;
        }
        .log-badge.success {
            background: #ecf5ff;
            color: #409eff;
        }
        .log-badge.failed {
            background: #fef0f0;
            color: #f56c6c;
        }
        .log-badge.hit {
            background: #f0f9eb;
            color: #67c23a;
        }
        @media (max-width: 900px) {
            body {
                height: 100dvh;
                min-height: 100dvh;
                overflow: hidden;
            }
            .header {
                padding: 12px;
            }
            .header-inner {
                align-items: stretch;
                gap: 10px;
            }
            .header-title {
                width: 100%;
                font-size: 17px;
            }
            .header-actions {
                width: 100%;
                gap: 8px;
            }
            .token-input {
                flex: 1 1 180px;
                width: auto;
                max-width: none;
                min-width: 0;
            }
            .token-btn,
            .admin-entry-btn {
                flex: 0 0 auto;
            }
            .auth-status {
                flex-basis: 100%;
                max-width: none;
                white-space: normal;
                line-height: 1.4;
                word-break: break-word;
            }
            .main-container {
                flex-direction: column;
                min-height: 0;
                padding: 12px;
                gap: 12px;
                overflow: hidden;
            }
            .upload-panel {
                flex: 0 0 auto;
                width: 100%;
                padding: 16px;
                gap: 12px;
            }
            .upload-panel h3 {
                margin-bottom: 0;
            }
            #docListBox {
                max-height: 140px;
            }
            .chat-panel {
                flex: 1 1 0;
                width: 100%;
                min-height: 0;
                overflow: hidden;
            }
            .chat-mode-bar {
                flex-wrap: wrap;
                padding: 10px 12px;
            }
            .agent-session-status {
                flex-basis: 100%;
                margin-left: 0;
            }
            .chat-messages {
                min-height: 0;
                padding: 14px;
                gap: 12px;
            }
            .message {
                max-width: 88%;
            }
            .chat-input-area {
                padding: 12px;
                gap: 8px;
            }
            .chat-input {
                min-width: 0;
            }
            .send-btn {
                flex: 0 0 auto;
                min-width: 64px;
                padding: 0 16px;
            }
            .admin-panel {
                min-height: 0;
                margin: 12px;
                overflow: hidden;
            }
            .admin-tabs {
                flex-wrap: wrap;
            }
            .admin-tab {
                flex: 1 1 auto;
                padding: 10px 8px;
                text-align: center;
            }
            .admin-tab-right {
                flex: 1 1 100%;
                margin-left: 0;
                padding: 8px 10px;
                text-align: right;
                border-top: 1px solid #f2f2f2;
            }
            .admin-tab-content {
                padding: 12px;
                overflow-x: hidden;
            }
            .admin-table {
                width: 100%;
                font-size: 13px;
            }
            .admin-table thead {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .admin-table tbody,
            .admin-table tr,
            .admin-table td {
                display: block;
                width: 100%;
            }
            .admin-table tr {
                margin-bottom: 12px;
                border: 1px solid #ebeef5;
                border-radius: 8px;
                overflow: hidden;
                background: #fff;
            }
            .admin-table td {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 9px 10px;
                text-align: left;
                word-break: break-word;
                border-bottom: 1px solid #f5f5f5;
            }
            .admin-table td:last-child {
                border-bottom: 0;
            }
            .admin-table td::before {
                content: attr(data-label);
                flex: 0 0 84px;
                color: #909399;
                font-weight: 500;
            }
            .log-result {
                max-width: none;
                min-width: 0;
            }
            .admin-pagination {
                padding: 12px;
                gap: 8px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <span class="header-title">RAG 智能知识库助手</span>
            <div class="header-actions">
                <input
                    type="password"
                    class="token-input"
                    id="authTokenInput"
                    placeholder="粘贴普通用户或管理员 Token"
                    autocomplete="off"
                >
                <button class="token-btn" id="applyToken">应用 Token</button>
                <span class="auth-status" id="authStatus">未填入 Token</span>
                <!-- 管理员入口：默认隐藏，角色为 admin 时自动显示 -->
                <button class="admin-entry-btn" id="adminEntry">管理后台</button>
            </div>
        </div>
    </div>

    <!-- 普通用户主界面 -->
    <div class="main-container">
        <!-- 左侧：文档上传区 -->
        <div class="upload-panel">
            <h3>文档上传</h3>
            <input type="file" class="file-input" id="fileInput" accept=".pdf,.docx,.doc">
            <button class="upload-btn" id="uploadBtn">上传文档</button>
            <div class="upload-result" id="uploadResult"></div>
            <!-- ==========新增文档列表DOM开始========== -->
            <div class="doc-list-title">已上传文档</div>
            <div id="docListBox">
                <div class="doc-item">暂无文档</div>
            </div>
            <!-- =============新增文档列表结束========== -->
        </div>
        <!-- 右侧：对话聊天区 -->
        <div class="chat-panel">
            <div class="chat-mode-bar">
                <label for="chatMode">对话模式</label>
                <select class="chat-mode-select" id="chatMode">
                    <option value="rag">知识库问答</option>
                    <option value="agent">学习管家</option>
                </select>
                <span class="agent-session-status" id="agentSessionStatus"></span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">你好！请先上传文档，然后就可以向我提问了。</div>
            </div>
            <div class="chat-input-area">
                <textarea class="chat-input" id="questionInput" placeholder="请输入你的问题..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <!-- 管理员面板：默认隐藏 -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="users">用户管理</div>
            <div class="admin-tab" data-tab="documents">文档管理</div>
            <div class="admin-tab" data-tab="logs">问答日志</div>
            <div class="admin-tab-right">
                <span class="exit-admin-btn" id="exitAdmin">返回聊天</span>
            </div>
        </div>
        <div class="admin-tab-content" id="adminTabContent">
            <div style="text-align: center; padding: 40px; color: #999;">加载中...</div>
        </div>
        <div class="admin-pagination">
            <span id="adminTotal">共 0 条</span>
            <div>
                <button class="send-btn" style="padding: 4px 10px; font-size: 12px;" id="prevPage">上一页</button>
                <button class="send-btn" style="padding: 4px 10px; font-size: 12px;" id="nextPage">下一页</button>
            </div>
        </div>
    </div>

    <script>
        // 鉴权 Token 从页面输入框读取并保存到 sessionStorage，避免在源码中硬编码
        let AUTH_TOKEN = sessionStorage.getItem('auth_token') || '';
        // 当前选中的文档ID， null 表示检索全部文档
        let selectedDocId = null;
        // Agent 会话ID，只保存当前登录用户最近一次会话
        let agentSessionId = sessionStorage.getItem('agent_session_id') || null;
        // 管理员分页变量
        let currentAdminTab = 'users';
        let adminPage = 1;
        let adminTotalCount = 0;
        const adminPageSize = 10;

        const authTokenInput = document.getElementById('authTokenInput');
        const applyTokenBtn = document.getElementById('applyToken');
        const authStatus = document.getElementById('authStatus');
        const adminEntry = document.getElementById('adminEntry');
        const mainContainer = document.querySelector('.main-container');
        const adminPanel = document.getElementById('adminPanel');
        const prevPageBtn = document.getElementById('prevPage');
        const nextPageBtn = document.getElementById('nextPage');
        const chatModeSelect = document.getElementById('chatMode');
        const agentSessionStatus = document.getElementById('agentSessionStatus');

        function setAuthStatus(message, isError = false) {
            authStatus.textContent = message;
            authStatus.className = isError ? 'auth-status error' : 'auth-status';
        }

        function authHeaders(initialHeaders = {}) {
            const headers = new Headers(initialHeaders);
            if (AUTH_TOKEN) {
                headers.set('Authorization', `Bearer ${AUTH_TOKEN}`);
            }
            return headers;
        }

        function authFetch(url, options = {}) {
            return fetch(url, {
                ...options,
                headers: authHeaders(options.headers || {})
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function updateChatModeUi() {
            if (chatModeSelect.value === 'agent') {
                questionInput.placeholder = '例如：帮我制定一周 FastAPI 学习计划';
                agentSessionStatus.textContent = agentSessionId ? '连续会话已启用' : '将创建新会话';
            } else {
                questionInput.placeholder = '请输入你的问题...';
                agentSessionStatus.textContent = '';
            }
        }

        // ==================== 原有功能代码 ====================
        // 文档上传功能
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadResult = document.getElementById('uploadResult');
        uploadBtn.addEventListener('click', async () => {
            if (!AUTH_TOKEN) {
                uploadResult.textContent = '请先填入 Token';
                uploadResult.className = 'upload-result error';
                return;
            }
            const file = fileInput.files[0];
            if (!file) {
                uploadResult.textContent = '请先选择文件';
                uploadResult.className = 'upload-result error';
                return;
            }
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            uploadResult.textContent = '';
            uploadResult.className = 'upload-result';
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await authFetch('/api/v1/files/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (response.ok) {
                    uploadResult.textContent = '上传成功！文档已解析入库';
                    uploadResult.className = 'upload-result';
                    // 新增：上传成功自动刷新文档列表
                    loadDocList();
                } else {
                    uploadResult.textContent = '上传失败：' + (result.message || '未知错误');
                    uploadResult.className = 'upload-result error';
                }
            } catch (error) {
                uploadResult.textContent = '请求失败：' + error.message;
                uploadResult.className = 'upload-result error';
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = '上传文档';
            }
        });
        // 对话问答功能
        const chatMessages = document.getElementById('chatMessages');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        // 向聊天区添加消息
        function addMessage(content, type, skipSave = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            // 自动滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
            // 保存历史（加载历史时跳过保存，避免重复写入）
            if (!skipSave) {
                saveChatHistory();
            }
        }
        // 保存聊天历史到本地存储
        function saveChatHistory() {
            const messages = [];
            chatMessages.querySelectorAll('.message').forEach(msg => {
                messages.push({
                    type: msg.classList.contains('user') ? 'user' : 'ai',
                    content: msg.textContent
                });
            });
            localStorage.setItem('rag_chat_history', JSON.stringify(messages));
        }
        // 加载本地聊天历史
        function loadChatHistory() {
            const history = localStorage.getItem('rag_chat_history');
            if (!history) return;
            try {
                const messages = JSON.parse(history);
                // 清空默认欢迎语
                chatMessages.innerHTML = '';
                messages.forEach(msg => {
                    addMessage(msg.content, msg.type, true);
                });
            } catch (e) {
                console.error('加载历史记录失败', e);
            }
        }
        // 加载已上传文档列表
        async function loadDocList() {
            const docListBox = document.getElementById('docListBox');
            if (!AUTH_TOKEN) {
                docListBox.innerHTML = '<div class="doc-item">请先填入 Token</div>';
                return;
            }
            try {
                const res = await authFetch("/api/v1/files", { method: "GET" });
                const result = await res.json();
                if(res.ok){
                    const docs = result.list;
                    if(!docs || docs.length ===0){
                        docListBox.innerHTML = '<div class="doc-item">暂无文档</div>';
                        return;
                    }
                    let htmlStr = "";
                    docs.forEach(item=>{
                        const isSelected = selectedDocId === item.id;
                        htmlStr += `<div class="doc-item" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: ${isSelected ? '#e8f4ff' : 'transparent'};">
                            <span class="doc-name" data-id="${item.id}">${escapeHtml(item.filename)}</span>
                            <span class="del-btn" data-id="${item.id}" style="color: #f56c6c; cursor: pointer; font-size: 12px;">删除</span>
                        </div>`;
                    })
                    docListBox.innerHTML = htmlStr;
                    // 绑定删除按钮点击事件
                    docListBox.querySelectorAll('.del-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            deleteDoc(id);
                        });
                    });
                    // 绑定文档点击选中事件
                    docListBox.querySelectorAll('.doc-name').forEach(name => {
                        name.addEventListener('click', (e) =>{
                            e.stopPropagation();
                            const id = parseInt(name.getAttribute('data-id'));
                            // 切换选中状态；再次点击取消选中
                            selectedDocId = selectedDocId === id ? null : id;
                            // 重新渲染列表更新高亮
                            loadDocList();
                        });
                    });
                }else{
                    const message = result.message || '获取文档列表失败';
                    docListBox.innerHTML = `<div class="doc-item">${escapeHtml(message)}</div>`;
                }
            }catch(err){
                console.error("获取文档列表异常", err);
                docListBox.innerHTML = '<div class="doc-item">网络异常</div>';
            }
        }
        // 删除指定文档
        async function deleteDoc(docId) {
            if(!confirm('确定要删除该文档吗？删除后无法恢复')) return;
            try {
                const res = await authFetch(`/api/v1/files/${docId}`,{
                    method: "DELETE"
                });
                const result = await res.json();
                if(res.ok && result.code === 200){
                    // 删除成功自动刷新列表
                    loadDocList();
                } else {
                    alert('删除失败：' + (result.message || '未知错误'));
                }
            } catch(err) {
                alert('删除请求异常：' + err.message);
            }
        }
        // 发送问题（流式输出版 + 全类型引用标记彻底清除）
        async function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;
            if (!AUTH_TOKEN) {
                setAuthStatus('请先填入 Token', true);
                return;
            }
            if (chatModeSelect.value === 'agent') {
                await sendAgentQuestion(question);
                return;
            }
            // 添加用户消息
            addMessage(question, 'user');
            questionInput.value = '';
            // 按钮禁用
            sendBtn.disabled = true;
            sendBtn.textContent = '处理中...';
            // 【修正：先创建元素，再设置内容】
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai';
            chatMessages.appendChild(aiMessageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            // 消息框显示思考动画
            aiMessageDiv.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
            try {
                // 【修正：接口路径从 /app/v1 改为 /api/v1】
                const response = await authFetch('/api/v1/rag/ask/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        doc_id: selectedDocId
                    })
                });
                if (!response.ok) {
                    aiMessageDiv.textContent = '请求失败：' + response.statusText;
                    return;
                }
                // 读取流式数据
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullText = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    // 解码数据片段
                    const chunk = decoder.decode(value, { stream: true });
                    // 按SSE协议解析：每段以 data: 开头
                    const lines = chunk.split('\n\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const content = line.slice(6);
                            // 跳过流结束标记
                            if (content === '[DONE]') continue;
                            try {
                                // 解析后端返回的JSON，提取真正的回答文本
                                const chunkObj = JSON.parse(content);
                                if (chunkObj.type === 'content' && chunkObj.data) {
                                    // 1. 先把当前片段追加到全文
                                    fullText += chunkObj.data;
                                    // 2. 全局清除所有类型引用标记（半角/全角/中文引号、单层/双层）
                                    fullText = fullText.replace(/[\[［「]{1,2}\s*\d*\s*[\]］」]{1,2}/g, '');
                                    // 3. 更新页面显示
                                    aiMessageDiv.textContent = fullText;
                                    // 自动滚动到底部
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                // 解析失败就原样追加，兜底
                                fullText += content;
                                fullText = fullText.replace(/[\[［「]{1,2}\s*\d*\s*[\]］」]{1,2}/g, '');
                                aiMessageDiv.textContent = fullText;
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                        }
                    }
                }
                // 【三步彻底清洗】
                // 1. 清除所有带数字的引用标记
                fullText = fullText.replace(/[\[［「]{1,2}\s*\d+\s*[\]］」]{1,2}/g, '');
                // 2. 清除所有空括号对
                fullText = fullText.replace(/[\[［「]{1,2}\s*[\]］」]{1,2}/g, '');
                // 3. 清除所有残留的单个括号字符
                fullText = fullText.replace(/[\[［「\]］」]/g, '');
                // 额外清理多余的连续空格，保持文本整洁
                fullText = fullText.replace(/\s{2,}/g, ' ');
                aiMessageDiv.textContent = fullText;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                // 最终保存完整回答到本地历史
                saveChatHistory();
            } catch (error) {
                aiMessageDiv.textContent = '请求异常：' + error.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }
        // 发送 Agent 学习管家消息
        async function sendAgentQuestion(question) {
            addMessage(question, 'user');
            questionInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '处理中...';
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai';
            aiMessageDiv.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
            chatMessages.appendChild(aiMessageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            try {
                const response = await authFetch('/api/v1/agent/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: agentSessionId,
                        message: question
                    })
                });
                const result = await response.json();
                if (response.ok && result.data) {
                    agentSessionId = result.data.session_id;
                    sessionStorage.setItem('agent_session_id', agentSessionId);
                    aiMessageDiv.textContent = result.data.reply;
                    updateChatModeUi();
                    saveChatHistory();
                } else {
                    aiMessageDiv.textContent = '请求失败：' + (result.message || response.statusText);
                    saveChatHistory();
                }
            } catch (error) {
                aiMessageDiv.textContent = '请求异常：' + error.message;
                saveChatHistory();
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
        // 绑定点击和回车发送
        sendBtn.addEventListener('click', sendQuestion);
        chatModeSelect.addEventListener('change', () => {
            updateChatModeUi();
            addMessage(
                chatModeSelect.value === 'agent'
                    ? '已切换到学习管家，可以管理目标、任务、进度和知识库问答。'
                    : '已切换到知识库问答，将基于已上传文档回答。',
                'ai'
            );
        });
        questionInput.addEventListener('keydown', (e) => {
            // Enter 发送消息（不按Ctrl时）
            if (e.key === 'Enter' && !e.ctrlKey) {
                e.preventDefault();
                sendQuestion();
            }
            // Ctrl+Enter 主动插入换行
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                const start = questionInput.selectionStart;
                const end = questionInput.selectionEnd;
                questionInput.value = questionInput.value.substring(0, start) + '\n' + questionInput.value.substring(end);
                questionInput.selectionStart = questionInput.selectionEnd = start + 1;
            }
        });

        // ==================== 新增：管理员相关逻辑 ====================
        // 1. 页面加载时获取用户角色，控制管理入口显示
        async function loadUserRole() {
            adminEntry.style.display = 'none';

            if (!AUTH_TOKEN) {
                setAuthStatus('未填入 Token');
                return;
            }

            try {
                const res = await authFetch('/api/v1/info', { method: 'GET' });
                const result = await res.json();
                if (res.ok && result.data) {
                    const role = result.data.role;
                    sessionStorage.setItem('role', role);
                    // 管理员角色显示入口
                    if (role === 'admin') {
                        adminEntry.style.display = 'block';
                    }
                    setAuthStatus(`已登录：${result.data.username}（${role}）`);
                } else {
                    sessionStorage.removeItem('role');
                    setAuthStatus(result.message || 'Token 无效或已过期', true);
                }
            } catch (err) {
                console.error('获取用户角色失败，不显示管理入口', err);
                setAuthStatus('Token 校验失败，请检查网络', true);
            }
        }

        async function initializeAuthorizedPage() {
            selectedDocId = null;
            adminEntry.style.display = 'none';
            adminPanel.style.display = 'none';
            mainContainer.style.display = 'flex';
            adminPage = 1;
            await Promise.all([loadDocList(), loadUserRole()]);
        }

        async function applyToken() {
            const token = authTokenInput.value.trim().replace(/^Bearer\s+/i, '');
            if (!token) {
                AUTH_TOKEN = '';
                sessionStorage.removeItem('auth_token');
                sessionStorage.removeItem('role');
                sessionStorage.removeItem('agent_session_id');
                agentSessionId = null;
                selectedDocId = null;
                adminEntry.style.display = 'none';
                adminPanel.style.display = 'none';
                mainContainer.style.display = 'flex';
                document.getElementById('docListBox').innerHTML = '<div class="doc-item">请先填入 Token</div>';
                setAuthStatus('未填入 Token', true);
                return;
            }

            AUTH_TOKEN = token;
            sessionStorage.setItem('auth_token', token);
            agentSessionId = null;
            sessionStorage.removeItem('agent_session_id');
            setAuthStatus('正在校验 Token...');
            updateChatModeUi();
            await initializeAuthorizedPage();
        }

        applyTokenBtn.addEventListener('click', applyToken);
        authTokenInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                applyToken();
            }
        });

        // 2. 打开管理员面板
        adminEntry.addEventListener('click', () => {
            mainContainer.style.display = 'none';
            adminPanel.style.display = 'flex';
            adminPage = 1;
            loadAdminTabData();
        });

        // 3. 返回聊天界面
        document.getElementById('exitAdmin').addEventListener('click', () => {
            adminPanel.style.display = 'none';
            mainContainer.style.display = 'flex';
        });

        // 4. Tab 切换
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAdminTab = tab.getAttribute('data-tab');
                adminPage = 1;
                loadAdminTabData();
            });
        });

        // 5. 分页按钮
        prevPageBtn.addEventListener('click', () => {
            if (adminPage > 1) {
                adminPage--;
                loadAdminTabData();
            }
        });
        nextPageBtn.addEventListener('click', () => {
            if (adminPage * adminPageSize < adminTotalCount) {
                adminPage++;
                loadAdminTabData();
            }
        });

        function updatePagination(total) {
            adminTotalCount = total;
            const totalPages = Math.max(1, Math.ceil(total / adminPageSize));
            if (adminPage > totalPages) {
                adminPage = totalPages;
                loadAdminTabData();
                return;
            }
            prevPageBtn.disabled = adminPage <= 1;
            nextPageBtn.disabled = total === 0 || adminPage >= totalPages;
        }

        // 6. 加载管理员Tab数据（用户列表/文档列表/问答日志）
        async function loadAdminTabData() {
            const contentBox = document.getElementById('adminTabContent');
            contentBox.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">加载中...</div>';

            try {
                let url = '';
                if (currentAdminTab === 'users') {
                    url = `/api/v1/admin/users?page=${adminPage}&page_size=${adminPageSize}`;
                } else if (currentAdminTab === 'documents') {
                    url = `/api/v1/admin/documents?page=${adminPage}&page_size=${adminPageSize}`;
                } else {
                    url = `/api/v1/admin/qa-logs?page=${adminPage}&page_size=${adminPageSize}`;
                }

                const res = await authFetch(url, { method: 'GET' });
                const result = await res.json();

                if (res.ok) {
                    renderAdminTable(result.data);
                } else {
                    contentBox.innerHTML = `<div style="text-align: center; padding: 40px; color: #f56c6c;">${escapeHtml(result.message || '加载失败')}</div>`;
                }
            } catch (err) {
                contentBox.innerHTML = '<div style="text-align: center; padding: 40px; color: #f56c6c;">网络异常，加载失败</div>';
            }
        }

        // 7. 渲染管理员表格
        function renderAdminTable(data) {
            const contentBox = document.getElementById('adminTabContent');
            const { total, list } = data;

            if (!list || list.length === 0) {
                contentBox.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">暂无数据</div>';
                document.getElementById('adminTotal').textContent = `共 0 条`;
                updatePagination(total || 0);
                return;
            }

            let tableHtml = '<table class="admin-table"><thead><tr>';
            if (currentAdminTab === 'users') {
                tableHtml += '<th>ID</th><th>用户名</th><th>邮箱</th><th>角色</th><th>创建时间</th>';
            } else if (currentAdminTab === 'documents') {
                tableHtml += '<th>ID</th><th>文件名</th><th>类型</th><th>大小</th><th>所属用户</th><th>创建时间</th>';
            } else {
                tableHtml += '<th>ID</th><th>用户ID</th><th>问题</th><th>结果摘要</th><th>命中</th><th>耗时</th><th>状态</th><th>创建时间</th>';
            }
            tableHtml += '</tr></thead><tbody>';

            list.forEach(item => {
                tableHtml += '<tr>';
                if (currentAdminTab === 'users') {
                    tableHtml += `<td data-label="ID">${item.id}</td><td data-label="用户名">${escapeHtml(item.username)}</td><td data-label="邮箱">${escapeHtml(item.email)}</td><td data-label="角色">${escapeHtml(item.role)}</td><td data-label="创建时间">${escapeHtml(item.create_time)}</td>`;
                } else if (currentAdminTab === 'documents') {
                    tableHtml += `<td data-label="ID">${item.id}</td><td data-label="文件名">${escapeHtml(item.filename)}</td><td data-label="类型">${escapeHtml(item.file_type)}</td><td data-label="大小">${item.file_size} 字节</td><td data-label="所属用户">${item.user_id}</td><td data-label="创建时间">${escapeHtml(item.create_time)}</td>`;
                } else {
                    const succeeded = item.status === 'success';
                    const statusText = succeeded ? '成功' : '失败';
                    const statusClass = succeeded ? 'success' : 'failed';
                    const resultText = succeeded
                        ? (item.answer_summary || '-')
                        : (item.error_msg || item.answer_summary || '-');
                    const hitText = item.hit_knowledge ? '是' : '否';
                    const hitClass = item.hit_knowledge ? 'hit' : '';
                    const latencyText = item.latency_ms === null || item.latency_ms === undefined
                        ? '-'
                        : `${item.latency_ms} ms`;
                    tableHtml += `<td data-label="ID">${item.id}</td><td data-label="用户ID">${item.user_id}</td><td data-label="问题"><span class="log-result">${escapeHtml(item.question || '-')}</span></td><td data-label="结果摘要"><span class="log-result">${escapeHtml(resultText)}</span></td><td data-label="命中"><span class="log-badge ${hitClass}">${hitText}</span></td><td data-label="耗时">${escapeHtml(latencyText)}</td><td data-label="状态"><span class="log-badge ${statusClass}">${statusText}</span></td><td data-label="创建时间">${escapeHtml(item.create_time)}</td>`;
                }
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table>';
            contentBox.innerHTML = tableHtml;
            document.getElementById('adminTotal').textContent = `共 ${total} 条`;
            updatePagination(total);
        }

        // 页面加载完毕执行
        window.onload = async function(){
            authTokenInput.value = AUTH_TOKEN;
            updateChatModeUi();
            loadChatHistory();
            if (AUTH_TOKEN) {
                await initializeAuthorizedPage();
            } else {
                document.getElementById('docListBox').innerHTML = '<div class="doc-item">请先填入 Token</div>';
                setAuthStatus('未填入 Token');
            }
        }
    </script>
</body>
